# dagpane CI — mirror-native.
#
# Published to the public mirror as .github/workflows/ci.yml, so every path here is relative
# to the repository root rather than to a monorepo module.
#
# The `claim` job is the point of this file. fmt, clippy and the unit tests catch ordinary
# mistakes; only that job catches the mistake that actually matters, which is a change that
# makes the runtime do more work — or less — than it says. This project's entire claim is a
# set of counts, so a build where the counts moved and nobody noticed is a build that
# shipped a different product.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
          rustup default 1.94.0

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

      - run: cargo fmt --all -- --check

      # --all-targets so tests and examples are linted too. A warning in a test is a warning
      # somebody has to triage.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # --locked: the lockfile in the repository is the build, not a suggestion.
      - run: cargo test --workspace --locked

      # The MSRVs in Cargo.toml are promises. An unenforced promise is a lie with a version
      # number on it — and there are two of them here, so both are checked. `dagpane-core`
      # builds on an older toolchain than the workspace does because its only dependency is
      # serde; checking only the workspace would leave core's lower number unverified, which
      # is the failure this job exists to prevent.
      - name: msrv
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --locked
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 check -p dagpane-core --locked

  claim:
    name: the counts the README prints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.94.0 --profile minimal && rustup default 1.94.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

      - name: build
        run: cargo build --release --locked -p dagpane-cli

      # Exit criterion 1 — the differential oracle. 200 random graphs, 2,400 interactions,
      # each checked against a full recompute for correctness AND against the structural
      # closure for economy. This is the test that can catch a scheduler that skips too
      # much; a count assertion on a hand-drawn graph cannot.
      - name: the oracle
        run: cargo test --release --locked -p dagpane-core --test oracle -- --nocapture

      # Exit criterion 2 — the published interaction still costs what the README says. The
      # numbers are read out of `explain --json`, which is the same Trace the server sends a
      # browser, so this asserts the product and not a test double.
      - name: an interaction over the bundled app touches 8 of 11 cells and sends 3 of 7 panes
        run: |
          set -euo pipefail
          ./target/release/dagpane explain examples/sales.toml --set min_amount=400 --json > /tmp/claim.json
          cat /tmp/claim.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/claim.json"))
          t = r["interaction"]["trace"]
          steps = t["steps"]
          got = {
              "total_cells": t["total_cells"],
              "visited": len(steps),
              "evaluated": sum(1 for s in steps if s["outcome"] == "evaluated"),
              "reused": sum(1 for s in steps if s["outcome"] == "reused"),
              "changed": sum(1 for s in steps if s["outcome"] == "evaluated" and s["changed"]),
              "untouched": len(r["interaction"]["untouched"]),
              "panes_sent": len(r["interaction"]["panes_sent"]),
              "panes_total": r["interaction"]["panes_total"],
          }
          want = {"total_cells": 11, "visited": 8, "evaluated": 6, "reused": 1,
                  "changed": 4, "untouched": 3, "panes_sent": 3, "panes_total": 7}
          if got != want:
              print("::error::the published counts moved.")
              for k in want:
                  if got[k] != want[k]:
                      print(f"::error::  {k}: README says {want[k]}, this build says {got[k]}")
              print("Either the change is wrong, or README.md and ARCHITECTURE.md §3 are now")
              print("wrong. Both are failures; neither is fixed by editing this file alone.")
              sys.exit(1)
          print("counts unchanged:", got)
          PY

      # Exit criterion 2b — every worked example still earns its graph. The apps under
      # examples/apps/ are the documentation for when to reach for this, so an app that
      # quietly stopped skipping work is a broken argument, not just a stale file. The gate
      # asserts both halves per app: something was skipped, and something was shown. It has
      # already caught the failure that motivated it — a checkbox written with a literal
      # `value` plus `skip_when`, which compiles, renders, and never skips, so the control
      # was wired to nothing and every pane repainted.
      - name: every example app still skips work
        run: DAGPANE=./target/release/dagpane python3 examples/tools/verify.py

      # Exit criterion 3 — the engine in a browser, and it is no longer a `cargo check`.
      #
      # This job used to assert only that `dagpane-core` COMPILES for wasm32, which held the
      # core to no filesystem, no clock and no threads and proved nothing about a browser.
      # It now builds the artefact a page actually loads and drives it in a real WebAssembly
      # engine — the four `extern "C"` exports, the hand-written length prefix and the
      # JavaScript that has to agree with both, which is the seam a hand-rolled ABI breaks at.
      #
      # `run.sh` also exports the bundled example and drives THAT, which is what asserts the
      # published interaction costs the same number of cells in a browser as on a server. A
      # browser build that recomputed a different number would be a different product.
      - name: the engine still builds for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p dagpane-core --target wasm32-unknown-unknown

      - name: the engine runs in a browser engine, and an export of it does too
        run: ./crates/wasm/tests/run.sh

      # The one test in the tree that needs a real BROWSER rather than a JavaScript engine,
      # because what it asserts is what a browser does about a closed socket — and that logic
      # lives in `client.html`, which nothing else here executes. A rolling update closes every
      # open connection on purpose, so this is what decides whether the drain buys a viewer
      # anything. The runner skips itself with exit 0 when no Chromium is on the machine, which
      # is why the step installs one rather than hoping.
      - name: the page comes back when the server does
        # `DAGPANE_REQUIRE_BROWSER` turns the runner's contributor-friendly skip into a
        # failure. Without it a runner with no browser would produce a green tick over a test
        # that never ran, which is worse than not having the step.
        #
        # Nothing is installed here: the GitHub-hosted image ships Google Chrome, and the
        # runner probes for it. If that ever stops being true this step fails loudly and says
        # which browsers it looked for, rather than an `apt-get` line failing for its own
        # reasons on an image whose package names move.
        env:
          DAGPANE_REQUIRE_BROWSER: "1"
        run: ./crates/serve/tests/run.sh

      # Exit criterion 4 — the single-binary claim is a tested artefact, not a README
      # sentence, and it includes the front end, which lives inside the executable.
      - name: static musl build
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl -p dagpane-cli
          BIN=target/x86_64-unknown-linux-musl/release/dagpane
          file "$BIN"
          # Accept either wording, positively. `ldd` says "not a dynamic executable" on musl
          # and "statically linked" on some static-PIE glibc builds; the negative form
          # reports a genuinely static binary as dynamic when it meets the second wording.
          if ! ldd "$BIN" 2>&1 | grep -Eq "not a dynamic executable|statically linked"; then
            echo "::error::the musl build is not static:"; ldd "$BIN"; exit 1
          fi
          "$BIN" --version
          "$BIN" check examples/sales.toml

  image:
    name: the Dockerfile builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The Dockerfile is the documented deployment path on the public mirror, and it was
      # broken on this branch until review caught it: the final stage copied LICENSE and
      # NOTICE out of a builder they had never been copied into. Nothing built the image, so
      # nothing noticed. This step is that "nothing".
      - name: docker build
        run: docker build -t dagpane:ci .

      - name: the image is the binary, and the binary works
        run: |
          set -euo pipefail
          # The image is `scratch` + one static binary: no shell, and no examples inside it.
          # The app is therefore mounted, which is also how anybody would really run this.
          docker run --rm dagpane:ci --version
          docker run --rm -v "$PWD/examples:/app:ro" dagpane:ci check /app/sales.toml

  invariants:
    name: architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # These are properties of the dependency graph, not of the code, so `cargo test`
      # cannot see them. The lock pins them; it does not defend them. A grep is cheap and
      # catches the case where somebody adds the dependency before writing the code that
      # would fail a test.
      - name: core stays pure
        run: |
          set -e
          for banned in tokio axum hyper reqwest ureq std-async futures; do
            if grep -qE "^\s*${banned}\b" crates/core/Cargo.toml; then
              echo "::error::crates/core must not depend on ${banned} — it is what makes"
              echo "::error::\`cargo test -p dagpane-core\` a complete test of the reactive"
              echo "::error::semantics on a machine with no browser and no network."
              exit 1
            fi
          done
          # No text scan for `unsafe` here. The obvious one — `grep -rq "unsafe" crates/core/src`
          # — matches `#![forbid(unsafe_code)]` itself, so the job would fail on the very lint
          # it is checking for. That is not hypothetical: this file is mirror-native and has
          # never run in the monorepo, so the bug would have surfaced on the public mirror's
          # first build. `forbid(unsafe_code)` is a compiler error, and `cargo build`/`cargo
          # test` in the `check` job already enforce it — a grep adds nothing it can get right.
          grep -q 'forbid(unsafe_code)' crates/core/src/lib.rs || {
            echo "::error::crates/core no longer declares forbid(unsafe_code)"; exit 1; }

      - name: app never depends on a server
        run: |
          set -e
          for banned in tokio axum hyper; do
            if grep -qE "^\s*${banned}\b" crates/app/Cargo.toml; then
              echo "::error::crates/app must not depend on ${banned} — the patch protocol has"
              echo "::error::to be testable with nothing listening on anything."
              exit 1
            fi
          done

      - name: host never depends on a runtime
        run: |
          set -e
          # `host` decides which app a request gets, how long it stays compiled, and what it
          # costs. Every one of those is a decision about a map, and a runtime in this crate
          # would make the isolation suite — two parties over one graph observe nothing of
          # each other — a test that needs a socket to run. That is precisely the test that
          # then gets skipped.
          for banned in tokio axum hyper; do
            if grep -qE "^\s*${banned}\b" crates/host/Cargo.toml; then
              echo "::error::crates/host must not depend on ${banned} — crates/serve owns the"
              echo "::error::socket and drives this one. Keeping the split is what makes"
              echo "::error::tests/isolation.rs runnable with nothing listening on anything."
              exit 1
            fi
          done

      - name: a network client lives in one place and is never in a default build
        run: |
          # The rule used to be "no HTTP client anywhere", and it was worth what it cost: a
          # data-app runtime that can phone home is not one anybody self-hosts. Real sources
          # made "nowhere" impossible, so it became a shape instead of an absence, and this
          # job checks the shape has three parts:
          #
          #   1. the dependency appears in exactly ONE manifest, `crates/connect`;
          #   2. it is `optional = true` there, behind a feature that is OFF by default;
          #   3. a DEFAULT build of the binary resolves neither — checked against the real
          #      resolution rather than against the manifests, because a feature enabled by
          #      some other crate's default would satisfy 1 and 2 and still ship the client.
          #
          # Part 3 is the one that actually holds. The first two exist so that a change that
          # would break it fails at review with a message about intent.
          python3 - <<'PY'
          import sys, tomllib
          from pathlib import Path

          # Clients, not servers. `hyper` is deliberately absent: axum is built on it and
          # this runtime's whole job is to SERVE HTTP. The promise is that it never CALLS
          # out, so the list is crates whose purpose is an outbound request or a database
          # connection. Adding `hyper` here would ban `crates/serve` and the check would be
          # deleted within a week, which is worse than a check with a stated edge.
          NET = {"reqwest", "ureq", "isahc", "curl", "surf",
                 "postgres", "tokio-postgres", "sqlx", "mysql", "rusqlite"}
          HOME = Path("crates/connect/Cargo.toml")
          SHIPPED = ("dependencies", "build-dependencies")
          bad = []

          for path in sorted(Path(".").rglob("Cargo.toml")):
              if "target" in path.parts:
                  continue
              manifest = tomllib.loads(path.read_text())
              tables = [(s, manifest.get(s, {})) for s in SHIPPED]
              tables += [(s, t.get(s, {}))
                         for t in manifest.get("target", {}).values() for s in SHIPPED]
              tables += [("workspace.dependencies", manifest.get("workspace", {}).get("dependencies", {}))]
              for table, entries in tables:
                  for name, spec in entries.items():
                      if name not in NET:
                          continue
                      if path != HOME:
                          bad.append(f"{path}: `{name}` in [{table}] — a network client or a "
                                     f"database driver belongs in {HOME} and nowhere else")
                      elif not (isinstance(spec, dict) and spec.get("optional")):
                          bad.append(f"{path}: `{name}` is not `optional = true`, so it would "
                                     f"be in every build")

          connect = tomllib.loads(HOME.read_text())
          if connect.get("features", {}).get("default"):
              bad.append(f"{HOME}: `default` must stay empty — `http` and `sql` are opt-in")

          for line in bad:
              print(f"::error::{line}")
          if bad:
              print("::error::see crates/connect/Cargo.toml for what this rule replaced and why.")
              sys.exit(1)
          print(f"network clients confined to {HOME}, all optional, default empty")
          PY

          # Part 3: the resolution, not the manifests.
          for crate in dagpane-cli dagpane-serve dagpane-app; do
            tree=$(cargo tree -p "$crate" -e normal --prefix none 2>/dev/null | awk '{print $1}' | sort -u)
            for banned in ureq reqwest isahc curl surf postgres tokio-postgres sqlx; do
              if echo "$tree" | grep -qx "$banned"; then
                echo "::error::a default build of ${crate} resolves ${banned}."
                echo "::error::The promise is that \`cargo install dagpane\` links no network"
                echo "::error::client and no database driver. Something turned a feature on."
                exit 1
              fi
            done
          done
          echo "default builds of cli, serve and app resolve no network client"

      - name: the bundled client fetches nothing it was not told to
        run: |
          # Also asserted by a unit test, which is the authoritative one — it enumerates the
          # two `fetch`es and the two `import`s the page is allowed and fails on a third. A
          # grep here catches the obvious shapes before a compile.
          if grep -qE 'script src=|@import |//cdn\.|insertAdjacentHTML|document\.write' \
               crates/serve/src/client.html; then
            echo "::error::the client must be one self-contained file that builds DOM nodes."
            exit 1
          fi
          # A renderer is served with the app. An import naming a host is a CDN with extra
          # steps, and `manifest::compile_renderers` refuses one — this is the other end.
          if grep -qE 'import\(["'"'"']?https?:|import\(["'"'"']?//' \
               crates/serve/src/client.html; then
            echo "::error::the client must not import code from another origin."
            exit 1
          fi

  sources:
    name: the gated sources, against a real database
    runs-on: ubuntu-latest

    # `http` and `sql` are off by default — see crates/connect/Cargo.toml for why that rule
    # replaced "no HTTP client anywhere" — and off by default is not the same as untested.
    # Without this job they rot until the first person to enable one finds out.
    #
    # The database is the point. `crates/app/tests/sql_parity.rs` runs one manifest over a
    # Postgres table and over a CSV export of the same rows and compares EVERY pane's
    # rendered view. That test cannot be written against a fake: the findings it exists to
    # catch — an int2 widened differently, a null read as a zero, a date that is not text on
    # the wire — are all properties of the real driver talking to a real server, and a mock
    # would assert this author's model of both.
    services:
      postgres:
        # Pinned by digest, not by tag, for the reason the cargo-deny step below gives about
        # actions: this file is PUBLISHED to the public mirror, and a moved tag matters most
        # exactly where a reader cannot see what moved. This digest was resolved from the
        # registry and its config blob checked: `postgres:16-alpine`, PG_VERSION 16.15.
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          # Not a secret, and deliberately not read from one. This database exists for the
          # length of one job, holds six rows of synthetic sales, and is reachable only from
          # this runner. Putting it in a repository secret would imply it protects something.
          # It IS a real password rather than `trust`, so the job exercises the DSN redaction
          # path the sources promise — an error that quotes it would be a finding.
          POSTGRES_PASSWORD: dagpane-ci
          POSTGRES_DB: dagpane_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DAGPANE_TEST_PG_URL: postgres://postgres:dagpane-ci@127.0.0.1:5432/dagpane_ci
      # Without this the sql tests SKIP when the URL is missing, and a skip reads as a pass.
      # A green tick over a test that never ran is the failure this whole file exists to
      # prevent, so in CI the skip is made impossible: the helper panics instead.
      DAGPANE_REQUIRE_PG: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.94.0 --profile minimal --component clippy && rustup default 1.94.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

      - name: lint with both features on
        run: |
          cargo clippy -p dagpane-connect --features http,sql --all-targets -- -D warnings
          cargo clippy -p dagpane-cli --features http,sql -- -D warnings

      # The http tests need no network: each starts a listener on 127.0.0.1 and answers its
      # own requests, because what is being tested is what happens to bytes off a socket —
      # an absent validator, a status that is not 200, a body past the cap — and a stubbed
      # client would prove none of it.
      - name: the sources
        run: cargo test -p dagpane-connect --features http,sql --locked

      - name: an app over a table renders what the same app over a CSV renders
        run: cargo test -p dagpane-app --features sql --locked

  supplychain:
    name: cargo-deny · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.94.0 --profile minimal && rustup default 1.94.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

      # Run the binary rather than the action. Two reasons: this repository has no attested
      # SHA for `cargo-deny-action`, and pinning by a tag in the file that is PUBLISHED to the
      # mirror is exactly where a moved tag would matter most; and `cargo install` is already
      # how the audit step below works, so this is one mechanism instead of two.
      #
      # `deny.toml` is committed and mirrored. Without it this check has no licence allowlist
      # and would pass while asserting nothing — a control that looks like a control.
      - name: cargo-deny
        run: |
          test -f deny.toml || { echo "::error::deny.toml is missing; the licence check would assert nothing"; exit 1; }
          cargo install cargo-deny --locked
          cargo deny check advisories bans licenses sources

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
